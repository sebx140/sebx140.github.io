<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sebx140's web</title>
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding-top: 60px;
            box-sizing: border-box;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .navbar-brand {
            color: #478800;
            font-size: 1.3rem;
            font-weight: bold;
            text-decoration: none;
            text-shadow: 0 0 8px rgba(71, 136, 0, 0.4);
            transition: text-shadow 0.3s ease;
        }

        .navbar-brand:hover {
            text-shadow: 0 0 15px rgba(71, 136, 0, 0.8);
        }

        .navbar-menu {
            display: flex;
            gap: 20px;
        }

        .navbar-item {
            color: #8b949e;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.2s ease, text-shadow 0.3s ease;
        }

        .navbar-item:hover {
            color: #478800;
            text-shadow: 0 0 10px rgba(71, 136, 0, 0.6);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        section {
            padding: 100px 0;
            min-height: 60vh;
            box-sizing: border-box;
        }

        .hero-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 80vh;
        }

        .hero-section h1 {
            color: #ffffff;
            font-size: 3.5rem;
            margin: 0 0 15px 0;
            animation: fadeIn 1.5s ease-in-out;
        }

        .hero-section p {
            color: #8b949e;
            font-size: 1.5rem;
            margin: 0;
        }

        h2 {
            color: #478800;
            font-size: 2rem;
            margin-top: 0;
            text-shadow: 0 0 8px rgba(71, 136, 0, 0.3);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .project-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .project-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.3s ease;
            cursor: pointer;
            height: 100%;
            box-sizing: border-box;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: #478800;
            box-shadow: 0 0 15px rgba(71, 136, 0, 0.3);
        }

        .project-card h3 {
            color: #478800;
            margin: 0 0 10px 0;
            text-shadow: 0 0 5px rgba(71, 136, 0, 0.2);
        }

        .project-card p {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <!-- El nombre ahora apunta a tu perfil de GitHub y se abre en pestaña nueva -->
        <a href="https://github.com/sebx140" target="_blank" class="navbar-brand">sebx140</a>
        <div class="navbar-menu">
            <a href="#projects" class="navbar-item">Projects</a>
        </div>
    </nav>

    <div class="container">
        
        <section id="home" class="hero-section">
            <h1>Welcome to my site</h1>
            <p>Coming soon...</p>
        </section>

        <section id="projects">
            <h2>My Projects</h2>
            <div class="projects-grid">
                
                <a href="https://github.com/sebx140/SMTCify" target="_blank" class="project-link">
                    <div class="project-card">
                        <h3>SMTCify</h3>
                        <p>A Minecraft mod that integrates Windows media playback, showing songs and controls directly in-game.</p>
                    </div>
                </a>

                <div class="project-card">
                    <h3>Coming Soon</h3>
                    <p></p>
                </div>
            </div>
        </section>

    </div>

</body>
</html>
